name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-rust:
    name: Build Rust binary
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ./others/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full tag annotation.

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Just
        uses: taiki-e/install-action@just

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-

      - name: Build release binary
        run: just build

      - name: Prepare artifact
        run: |
          mkdir -p dist/
          bin=$(just ci-bin-name)
          platform=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          cp "target/release/$bin" "dist/${bin}-${{ github.ref_name }}-${platform}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ runner.os }}
          # `actions/upload-artifact@v4` does not use `working-directory`.
          # https://github.com/actions/upload-artifact/issues/232#issuecomment-964235360
          path: ./others/rust/dist/
          if-no-files-found: error

  build-python:
    name: Build Python package
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./others/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up `uv`
        uses: astral-sh/setup-uv@v6

      - name: Build Python distribution
        run: uv build

      - name: Upload Python distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: ./others/python/dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-rust
      - build-python
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # `actions/checkout@v4` somehow transforms annotated tags into
      # lightweight tags, which prevents us from reading release notes.
      # This fetches annotated tags and overrides existing mangled tags.
      - name: Fetch annotated tags
        run: git fetch --tags --force

      - name: Extract tag annotation
        id: tag
        run: |
          title=$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})
          body=$(git tag -l --format='%(contents:body)' ${{ github.ref_name }})
          echo "title=$title" >> $GITHUB_OUTPUT
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ${{ github.event.repository.name }}-*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.title }}
          body: ${{ steps.tag.outputs.body }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish crate
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./others/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish Python package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Rust and Python versions are released independently.
          skip-existing: true
